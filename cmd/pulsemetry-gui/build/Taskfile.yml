version: '3'

tasks:
  install:frontend:deps:
    summary: Install frontend dependencies
    run: once
    cmds:
      - task: install:frontend:deps:{{.PACKAGE_MANAGER}}

  install:frontend:deps:npm:
    dir: frontend
    sources:
      - package.json
      - package-lock.json
    generates:
      - node_modules/.package-lock.json
    preconditions:
      - sh: npm version
        msg: "Looks like npm isn't installed. Npm is part of the Node installer: https://nodejs.org/en/download/"
    cmds:
      - npm ci

  build:frontend:
    label: build:frontend (DEV={{.DEV}} RUNNER={{.PACKAGE_MANAGER}})
    summary: Build the frontend project
    # darwin:build:universal runs its per-arch builds as parallel deps, each of
    # which depends on this task. Without run:once the two executions race:
    # one regenerates frontend/bindings (-clean deletes it first) while the
    # other's bundler is reading it, failing intermittently with
    # 'Could not resolve "./bindings/<pkg>"' (#4637).
    run: once
    dir: frontend
    sources:
      - "**/*"
      - exclude: node_modules/**/*
    generates:
      - dist/**/*
    deps:
      - task: install:frontend:deps
      - task: generate:bindings
        vars:
          BUILD_FLAGS:
            ref: .BUILD_FLAGS
          OBFUSCATED:
            ref: .OBFUSCATED
    cmds:
      - task: frontend:run
        vars:
          SCRIPT: '{{if eq .DEV "true"}}build:dev{{else}}build{{end}}'
    env:
      PRODUCTION: '{{if eq .DEV "true"}}false{{else}}true{{end}}'

  frontend:run:
    summary: Run a frontend script with selected runner
    cmds:
      - task: frontend:run:{{.PACKAGE_MANAGER}}
        vars:
          SCRIPT: "{{.SCRIPT}}"
    vars:
      SCRIPT: "{{.SCRIPT}}"

  frontend:run:npm:
    dir: frontend
    cmds:
      - npm run {{.SCRIPT}} -q
    vars:
      SCRIPT: "{{.SCRIPT}}"

  generate:bindings:
    summary: Generates bindings for the frontend
    run: once
    sources:
      - "**/*.[jt]s"
      - exclude: frontend/**/*
      - frontend/bindings/**/*  # Rerun when switching between dev/production mode causes changes in output
      - "**/*.go"
      # 바인딩은 모듈 전체에서 생성된다. 이 Taskfile 기준의 "**/*.go" 는 cmd/pulsemetry-gui
      # 아래만 보는데, 바인딩에 실리는 타입은 루트의 internal/dashboard 에 있다. 그것을
      # 넣지 않으면 internal 의 Go 모델을 고쳐도 task 가 "up to date" 로 보고 재생성을
      # 건너뛴다 — 빌드는 성공하고 앱만 낡은 타입으로 돈다.
      #
      # go.mod·go.sum 도 앞에 ../../ 가 없으면 존재하지 않는 cmd/pulsemetry-gui/go.mod 를
      # 가리킨다. 모듈은 루트에 하나뿐이다.
      - "../../internal/**/*.go"
      - ../../go.mod
      - ../../go.sum
    generates:
      - frontend/bindings/**/*
    cmds:
      - wails3 generate bindings -f '{{.BUILD_FLAGS}}' -clean=true{{if eq .OBFUSCATED "true"}} -obfuscated{{end}} -ts -i

  generate:icons:
    # wails3 generate icons 를 쓰지 않는다. 그것은 appicon.png 한 장을 모든 크기로 줄이는데,
    # 16·24px 는 링을 뺀 전용 그림을 써야 한다. 트레이 아이콘은 GUI 가 런타임에 그린다.
    # 산출물은 커밋되어 있으므로 하나라도 없을 때만 다시 만든다. SVG 를 고쳤다면 레포
    # 루트에서 `task gen:icons` 로 강제 재생성한다.
    summary: Generates app icons from build/icons/*.svg via scripts/gen-icons (only when outputs are missing).
    run: once
    # 릴리스(scripts/package-gui.mjs)는 build 를 복사한 ASSETS_DIR 에 대해 -f 로 강제 실행하므로
    # 그때는 복사본 안에 다시 만든다. 일반 개발에서는 기존 build 를 쓴다.
    dir: ../../scripts/gen-icons
    status:
      - test -f "{{.ASSETS_PATH}}/appicon.png"
      - test -f "{{.ASSETS_PATH}}/darwin/icons.icns"
      - test -f "{{.ASSETS_PATH}}/windows/icon.ico"
      - test -f "{{.ASSETS_PATH}}/linux/icons/hicolor/scalable/apps/pulsemetry.svg"
    cmds:
      - npm ci --no-audit --no-fund
      - node gen-icons.mjs "{{.ASSETS_PATH}}"

  dev:frontend:
    summary: Runs the frontend in development mode
    deps:
      - task: install:frontend:deps
    cmds:
      - task: frontend:dev:{{.PACKAGE_MANAGER}}

  frontend:dev:npm:
    dir: frontend
    cmds:
      - npm run dev -- --port {{.VITE_PORT}} --strictPort


  update:build-assets:
    summary: Updates the build assets
    # build/config.yml 의 info 나 fileAssociations 를 고친 뒤 이것을 돌린다.
    # 아이콘·매니페스트·Info.plist 등 생성 자산을 config 기준으로 다시 만든다.
    dir: build
    cmds:
      - wails3 update build-assets -name "{{.APP_NAME}}" -binaryname "{{.APP_NAME}}" -config config.yml -dir .
