name: Product Release

on:
  push:
    tags: ['v*']

concurrency:
  group: product-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Validate release tag and main ancestry
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version=$(node scripts/release.mjs validate-tag "$RELEASE_TAG")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Install Task runner
        run: go install github.com/go-task/task/v3/cmd/task@v3.40.1

      - name: Check CLI
        run: task check:cli

  build:
    name: Package (${{ matrix.os }}/${{ matrix.arch }})
    needs: validate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # GUI는 플랫폼 라이브러리를 링크하므로 각 OS·CPU의 네이티브 러너에서 만든다.
      matrix:
        include:
          - {os: windows, arch: amd64, runner: windows-2025}
          - {os: windows, arch: arm64, runner: windows-11-arm}
          - {os: darwin, arch: amd64, runner: macos-15-intel}
          - {os: darwin, arch: arm64, runner: macos-15}
          - {os: linux, arch: amd64, runner: ubuntu-24.04}
          - {os: linux, arch: arm64, runner: ubuntu-24.04-arm}
    env:
      TARGET_OS: ${{ matrix.os }}
      TARGET_ARCH: ${{ matrix.arch }}
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cmd/pulsemetry-gui/frontend/package-lock.json

      - name: Install Linux GUI build and package dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev patchelf desktop-file-utils

      - name: Prepare Windows installer tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco upgrade nsis --version=3.12.0 --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $nsisDirectory = Join-Path ${env:ProgramFiles(x86)} 'NSIS'
          if (!(Test-Path (Join-Path $nsisDirectory 'makensis.exe'))) { throw 'NSIS compiler not found' }
          $nsisDirectory >> $env:GITHUB_PATH
          $sevenZipDirectory = Join-Path $env:ProgramFiles '7-Zip'
          if (!(Test-Path (Join-Path $sevenZipDirectory '7z.exe'))) { throw '7-Zip not found' }
          $sevenZipDirectory >> $env:GITHUB_PATH

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.11

      - name: Install Task runner
        run: go install github.com/go-task/task/v3/cmd/task@v3.40.1

      - name: Build product
        run: task build TARGET_OS="$TARGET_OS" TARGET_ARCH="$TARGET_ARCH" CLI_VERSION="$RELEASE_VERSION" GUI_VERSION="$RELEASE_VERSION"

      - name: Package GUI
        run: task package:gui TARGET_OS="$TARGET_OS" TARGET_ARCH="$TARGET_ARCH" GUI_VERSION="$RELEASE_VERSION"

      - name: Validate and stage release assets
        run: node scripts/release.mjs stage "$TARGET_OS" "$TARGET_ARCH" "$RELEASE_VERSION"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.os }}-${{ matrix.arch }}
          path: artifacts/release/${{ matrix.os }}-${{ matrix.arch }}/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: [validate, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # 빌드·검증은 읽기 권한으로 끝내고 공개 단계에만 쓰기 권한을 준다.
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: artifacts/release
          merge-multiple: true

      - name: Verify complete asset set and generate checksums
        run: node scripts/release.mjs checksums artifacts/release

      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/release.mjs publish "$RELEASE_TAG" artifacts/release
