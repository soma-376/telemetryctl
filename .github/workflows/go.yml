name: Go CI

on:
  push:
    branches: ["develop", "main"]
  pull_request:
    branches: ["develop", "main"]
  workflow_dispatch:

# 같은 ref 에 새 커밋이 오면 이전 실행은 취소한다. 3개 OS 매트릭스라 실행 비용이 3배다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 이 워크플로는 코드를 읽기만 한다.
permissions:
  contents: read

jobs:
  build-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      # 한 OS 가 깨져도 나머지 OS 결과를 봐야 "이 OS 만의 문제"인지 판별할 수 있다.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          # Go 버전은 go.mod 의 go 지시자를 단일 출처로 삼는다. 여기에 버전을 하드코딩하면
          # go.mod 를 올릴 때 CI 만 뒤처져 로컬과 다른 툴체인으로 검증하게 된다.
          go-version-file: go.mod
          # setup-go 내장 캐시가 go.sum 해시를 키로 모듈 캐시와 빌드 캐시를 복원한다.
          # 별도의 actions/cache 스텝은 필요 없다.
          cache: true
          cache-dependency-path: go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test (race + cover)
        # -race 는 CGO 를 요구한다. 3개 러너 이미지 모두 C 컴파일러를 갖고 있어 그대로 돈다
        # (ubuntu: gcc, macos: Xcode clang, windows: 러너 이미지에 mingw-w64 gcc 포함).
        # CGO_ENABLED 를 명시해 두는 이유: Go 는 C 컴파일러를 찾지 못하면 CGO_ENABLED 를
        # 0 으로 기본 설정하는데, 그러면 "-race requires cgo" 로 즉시 실패한다.
        # 즉 러너 이미지에서 컴파일러가 빠지는 날 조용히 race 검사 없이 통과하지 않는다.
        env:
          CGO_ENABLED: "1"
        run: go test -race -cover ./...

      - name: Build without CGO
        # ADR 0002 회귀 방지. 순수 Go SQLite 드라이버(modernc.org/sqlite)를 고른 이유가
        # "배포 바이너리가 C 툴체인을 요구하지 않는 것"이다. CGO 를 요구하는 의존성이
        # 섞여 들어오면 여기서 잡힌다.
        # 위 -race 스텝과 반드시 별개 스텝이어야 한다 — -race 는 CGO_ENABLED=1 이 필수라
        # 잡 전체에 CGO_ENABLED=0 을 걸면 race 테스트가 돌지 못한다.
        env:
          CGO_ENABLED: "0"
        run: go build ./...

  format-deps:
    name: Format & Dependencies
    # 포맷과 의존성 파일은 OS 에 의존하지 않는 저장소 속성이라 한 번만 검사한다.
    # 특히 windows 러너는 Git for Windows 기본값(core.autocrlf=true)으로 체크아웃해
    # 모든 .go 파일이 CRLF 가 되고, 그러면 gofmt 가 전 파일을 미포맷으로 신고한다.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: gofmt
        # gofmt -l 은 미포맷 파일 목록을 출력만 하고 종료 코드는 언제나 0 이다.
        # `run: gofmt -l .` 로 두면 검사하는 시늉만 하고 항상 통과한다.
        # 출력이 비어 있지 않으면 명시적으로 실패시켜야 실제로 잡힌다.
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt 가 적용되지 않은 파일이 있다. 'gofmt -w .' 로 정리해라."
            echo "$unformatted"
            exit 1
          fi
          echo "gofmt: 미포맷 파일 없음"

      - name: go mod tidy check
        # go.mod / go.sum 이 실제 import 와 어긋난 채로 머지되는 것을 막는다.
        # -diff 는 파일을 쓰지 않고 필요한 변경을 diff 로 출력하며, 변경이 필요하면
        # 0 이 아닌 코드로 종료한다. 워크스페이스를 더럽히지 않아 CI 에 적합하다.
        run: go mod tidy -diff
