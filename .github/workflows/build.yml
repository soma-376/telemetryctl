name: "Build & Test"

on:
  push:
    branches: ["develop", "main"]
  pull_request:
    branches: ["develop", "main"]
  workflow_dispatch:

# 같은 ref에 새 커밋이 오면 이전 실행은 취소한다. 네이티브 제품 빌드는 6개 러너를 쓴다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 이 워크플로는 코드를 읽기만 한다.
permissions:
  contents: read

jobs:
  build-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      # 한 OS 가 깨져도 나머지 OS 결과를 봐야 "이 OS 만의 문제"인지 판별할 수 있다.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          # Go 버전은 go.mod 의 go 지시자를 단일 출처로 삼는다. 여기에 버전을 하드코딩하면
          # go.mod 를 올릴 때 CI 만 뒤처져 로컬과 다른 툴체인으로 검증하게 된다.
          go-version-file: go.mod
          # setup-go 내장 캐시가 go.sum 해시를 키로 모듈 캐시와 빌드 캐시를 복원한다.
          # 별도의 actions/cache 스텝은 필요 없다.
          cache: true
          cache-dependency-path: go.sum

      - name: Install Task runner
        run: go install github.com/go-task/task/v3/cmd/task@v3.40.1

      # 무엇을 검사하는지는 루트 Taskfile.yml 이 정한다. 여기서 go 명령을 직접 치면
      # 같은 지식이 두 곳에 생기고, 그것이 어긋나 이 잡이 깨진 적이 있다.
      # 이 잡은 프런트엔드도 빌드하지 않는다 — 검사 범위가 GUI 를 빼므로 dist 가 필요 없다.
      - name: Check CLI
        run: task check:cli

      - name: Check CLI without CGO
        run: task check:cli:nocgo

  product-build:
    # 릴리스와 같은 OS·CPU에서 빌드·패키징하고 최종 첨부 파일을 검증한다.
    # 제품 빌드는 GUI가 링크하는 네이티브 라이브러리까지 포함하는 검사다.
    name: Product Build (${{ matrix.os }}/${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      # 한 OS 가 깨져도 나머지 결과를 봐야 "이 OS 만의 문제"인지 판별할 수 있다.
      fail-fast: false
      matrix:
        include:
          - {os: windows, arch: amd64, runner: windows-2025}
          - {os: windows, arch: arm64, runner: windows-11-arm}
          - {os: darwin, arch: amd64, runner: macos-15-intel}
          - {os: darwin, arch: arm64, runner: macos-15}
          - {os: linux, arch: amd64, runner: ubuntu-24.04}
          - {os: linux, arch: arm64, runner: ubuntu-24.04-arm}
    env:
      TARGET_OS: ${{ matrix.os }}
      TARGET_ARCH: ${{ matrix.arch }}
      PRODUCT_VERSION: 0.1.0
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cmd/pulsemetry-gui/frontend/package-lock.json

      # Wails v3 의 리눅스 백엔드는 GTK4 와 WebKitGTK 6.0 을 pkg-config 로 찾아 링크한다.
      # 러너 이미지에는 둘 다 없어서, 이 스텝이 없으면 GUI 빌드가
      # "Package 'gtk4', required by 'virtual:world', not found" 로 멈춘다.
      # glib-2.0·gio-unix-2.0·libsoup-3.0 은 이 둘의 의존성으로 함께 딸려온다.
      #
      # macOS 는 준비할 것이 없다 — 창을 띄우는 쪽이 Objective-C 라 C 툴체인이 필요한데,
      # 러너 이미지의 Xcode clang 이 그 역할을 한다. Windows 는 WebView2 를 쓰므로
      # 시스템 라이브러리도 C 툴체인도 요구하지 않는다.
      - name: Install Linux GUI build and package dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev patchelf desktop-file-utils

      - name: Prepare Windows installer tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco upgrade nsis --version=3.12.0 --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $nsisDirectory = Join-Path ${env:ProgramFiles(x86)} 'NSIS'
          if (!(Test-Path (Join-Path $nsisDirectory 'makensis.exe'))) { throw 'NSIS compiler not found' }
          $nsisDirectory >> $env:GITHUB_PATH
          $sevenZipDirectory = Join-Path $env:ProgramFiles '7-Zip'
          if (!(Test-Path (Join-Path $sevenZipDirectory '7z.exe'))) { throw '7-Zip not found' }
          $sevenZipDirectory >> $env:GITHUB_PATH

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.11

      - name: Install Task runner
        run: go install github.com/go-task/task/v3/cmd/task@v3.40.1

      - name: Build product
        run: task build TARGET_OS="$TARGET_OS" TARGET_ARCH="$TARGET_ARCH" CLI_VERSION="$PRODUCT_VERSION" GUI_VERSION="$PRODUCT_VERSION"

      - name: Package GUI
        run: task package:gui TARGET_OS="$TARGET_OS" TARGET_ARCH="$TARGET_ARCH" GUI_VERSION="$PRODUCT_VERSION"

      - name: Validate release assets
        run: node scripts/release.mjs stage "$TARGET_OS" "$TARGET_ARCH" "$PRODUCT_VERSION"

      # 커밋된 frontend/bindings 가 현재 Go 코드와 맞는지 본다. 이 잡에서 도는 이유는
      # 바인딩 생성이 wails3 와 (리눅스라면) GTK4 헤더를 요구하는데 그 둘을 갖춘 잡이
      # 여기뿐이기 때문이다. static-checks 에 두면 설치 스텝 두 개가 더 붙는다.
      #
      # 리눅스 amd64에서만 도는 이유는 static-checks가 리눅스인 것과 같다. windows 러너는
      # core.autocrlf=true 로 체크아웃해 git diff 가 전 파일을 변경으로 신고한다.
      # 바인딩 출력은 OS 를 타지 않는다 — internal/dashboard 의 OS 별 파일이 정의하는
      # fileManagerCommand·acceptExitCode 는 unexported 라 바인딩에 실리지 않는다.
      - name: Check bindings are up to date
        if: matrix.os == 'linux' && matrix.arch == 'amd64'
        run: task check:bindings

  static-checks:
    name: Static Checks
    # 코드를 실행하지 않고 읽기만 하는 검사를 모은다. 결과가 OS 에 의존하지 않으므로
    # 3개 러너에서 돌릴 이유가 없다.
    #
    # 리눅스 러너인 것에도 이유가 있다. windows 러너는 Git for Windows 기본값
    # (core.autocrlf=true)으로 체크아웃해 모든 .go 파일이 CRLF 가 되고, 그러면 gofmt 가
    # 전 파일을 미포맷으로 신고한다.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cmd/pulsemetry-gui/frontend/package-lock.json

      - name: Install Task runner
        run: go install github.com/go-task/task/v3/cmd/task@v3.40.1

      # 프런트 의존성 설치는 여기 없다 — check:frontend 가 deps 로 직접 챙긴다. 여기에
      # npm ci 를 두면 "무엇을 검사하는가" 가 두 곳으로 갈리고, 이 잡만 통과하는 대신
      # 로컬 task test 는 신규 체크아웃에서 깨진 채로 남는다. 실제로 그 상태였다.
      #
      # dist 는 필요 없다 — 타입만 읽으므로 vite build 를 앞세우지 않는다.
      - name: Check format and dependencies
        run: task check:format

      - name: Check frontend types, lint and format
        run: task check:frontend

      - name: Test frontend interactions
        run: task test:frontend

      - name: Test release validation and publication rules
        run: task test:release
