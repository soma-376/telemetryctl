# enrollment 서버 개발용 인프라. 서버 자체는 아직 `go run ./cmd/server` 로 띄운다
# (store.Memory → Postgres 교체 전까지 서버는 이 DB 를 사용하지 않는다).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: enrollment
      POSTGRES_PASSWORD: enrollment
      POSTGRES_DB: enrollment
    ports:
      - "55433:5432" # 호스트 디버그용(ai-telemetry-pipeline 의 55432 와 충돌 회피)
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations/000001_init.up.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/seed/dev.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U enrollment -d enrollment"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

volumes:
  pgdata:
